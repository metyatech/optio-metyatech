# Optio Helm Chart — Local Development Overrides
#
# Use with: helm install optio helm/optio -f helm/optio/values.local.yaml ...
# (setup-local.sh applies this automatically)
#
# Overrides GHCR defaults with locally-built images (pullPolicy: Never)
# so k3d local development uses images imported into the node cache.

# --- API Server ---
api:
  image:
    repository: optio-api
    pullPolicy: Never
    tag: "latest"
  service:
    type: ClusterIP
    nodePort: ""

# --- Web UI ---
web:
  image:
    repository: optio-web
    pullPolicy: Never
    tag: "latest"
  service:
    type: ClusterIP
    nodePort: ""

# --- Optio operations assistant ---
optio:
  image:
    repository: optio-optio
    pullPolicy: Never
    tag: "latest"

# --- Agent containers ---
agent:
  image:
    repository: optio-base
    pullPolicy: Never
    prefix: "optio-"
    tag: "latest"
  imagePullPolicy: Never

# --- Auth disabled for local dev ---
auth:
  disabled: true

# --- Single localhost entrypoint via k3d + ingress-nginx ---
publicUrl: http://localhost

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: localhost
      paths:
        - path: /
          pathType: Prefix
          service: web
        - path: /api
          pathType: Prefix
          service: api
        - path: /ws
          pathType: Prefix
          service: api

# --- Local Postgres password ---
postgresql:
  auth:
    password: optio_dev
